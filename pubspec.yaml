name: face_recognition
description: "Real-time face detection and recognition using MediaPipe + MobileFaceNet."
publish_to: 'none'

version: 1.0.0+1

environment:
  # FIX #1: sdk: ^3.10.8 is invalid — Dart 3.10 does not exist.
  # Changed to a valid open range matching current stable Dart 3.x.
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.0+1
  path_provider: ^2.1.5
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  cupertino_icons: ^1.0.8

  # FIX #6: Added permission_handler so the app can request CAMERA
  # permission at runtime on Android 6.0+ / iOS.
  permission_handler: ^11.3.0

  flutter_face_mesh:
    path: ../flutter_face_mesh

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    # FIX #2: Removed 'assets/face_landmarker.task' — that file lives in the
    # flutter_face_mesh plugin package and is automatically bundled by Flutter
    # under packages/flutter_face_mesh/assets/face_landmarker.task.
    # Declaring it here with no matching file in the app's own assets/ dir
    # causes a fatal build error: "No file or variants found for asset".
    - assets/mobilefacenet.tflite
